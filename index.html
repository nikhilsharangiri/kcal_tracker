<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e66">
<title>Kcal Tracker</title>
<style>
  :root{
    --bg:#f4f6f3; --card:#fff; --ink:#1c2a22; --muted:#6b7a71; --line:#e3e9e4;
    --green:#2f9e66; --green-d:#1f7a4d; --amber:#e8a33d; --red:#d6544a; --blue:#4a7fd6; --pink:#d65a8f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px}
  .wrap{max-width:480px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:20px;font-weight:700}
  .badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#dff4e8;color:var(--green-d);margin-left:8px;vertical-align:middle}
  .badge.off{background:#fde3e0;color:#a33}
  .badge.sync{background:#fff3dc;color:#9a6a12}
  .icon-btn{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer}
  .datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:8px;border:1px solid var(--line);margin-bottom:14px}
  .datebar button{border:none;background:#eef3ef;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
  .datebar .d{text-align:center;font-weight:600}
  .datebar .d small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .datebar input{border:none;background:transparent;font:inherit;font-weight:600;text-align:center;width:150px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:132px;height:132px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .c b{font-size:26px;line-height:1}
  .ring .c span{font-size:11px;color:var(--muted);margin-top:3px}
  .stats{flex:1;font-size:14px}
  .stats div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .stats div:last-child{border:none}
  .stats span{color:var(--muted)}
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .macro{text-align:center}
  .macro .bar{height:6px;border-radius:9px;background:#edf1ee;margin:6px 0;overflow:hidden}
  .macro .bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
  .macro b{font-size:15px}
  .macro small{color:var(--muted);font-size:11px}
  .meal-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 8px;font-weight:600}
  .meal-h span{font-size:13px;color:var(--muted);font-weight:500}
  .entry{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .entry.pending{opacity:.55}
  .entry .t{flex:1;min-width:0}
  .entry .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .entry .t small{color:var(--muted);font-size:12px}
  .entry .k{font-weight:700}
  .entry .x{border:none;background:none;color:#b3bdb6;font-size:18px;cursor:pointer;padding:4px}
  .entry .x:hover{color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--green);color:#fff;border:none;border-radius:99px;padding:15px 28px;font-size:16px;font-weight:600;box-shadow:0 8px 22px rgba(47,158,102,.4);cursor:pointer}
  .fab:active{background:var(--green-d)}
  .sheet-bg{position:fixed;inset:0;background:rgba(15,25,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
  .sheet h2{font-size:18px;margin-bottom:6px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fbfcfb}
  input:focus,select:focus{outline:2px solid #b9e3cd;border-color:var(--green)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fbfcfb;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .chip.sm{padding:6px 11px;font-size:13px}
  .chip.rc{background:#eef7f1;border-color:#cfe8da;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .searchbox{position:relative}
  .searchbox input{padding-left:38px}
  .searchbox::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
  .searchbox .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:16px;color:var(--muted);padding:8px;cursor:pointer;display:none}
  .results{margin-top:8px;border:1px solid var(--line);border-radius:12px;max-height:250px;overflow:auto;display:none;background:#fff}
  .results.show{display:block}
  .res{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #f0f3f1;cursor:pointer}
  .res:last-child{border:none}
  .res.act,.res:hover{background:#eef7f1}
  .res b{font-weight:500;font-size:14px;min-width:0}
  .res b mark{background:#d6f0e0;color:inherit;border-radius:3px}
  .res span{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
  .res-empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
  .selcard{display:none;margin-top:10px;padding:12px;border-radius:12px;background:#eef7f1;font-size:14px}
  .selcard.show{display:block}
  .selcard b{display:block;font-size:15px}
  .selcard small{color:var(--muted)}
  .stepper{display:flex;gap:8px;align-items:center}
  .stepper button{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fbfcfb;font-size:20px;cursor:pointer}
  .stepper input{text-align:center;font-weight:600}
  .pick{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb}
  .pick .pt{flex:1;min-width:0}
  .pick .pt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick .pt small{color:var(--muted);font-size:12px}
  .pick .pq{display:flex;align-items:center;gap:4px;flex:none}
  .pick .pq button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;padding:0}
  .pick .pq input{width:54px;padding:6px 4px;text-align:center;font-weight:600;border-radius:9px}
  .pick .px{border:none;background:none;color:#b3bdb6;font-size:17px;cursor:pointer;padding:4px;flex:none}
  .pick .px:hover{color:var(--red)}
  .picklbl{margin-top:14px;font-size:12px;color:var(--muted)}
  .preview{margin-top:14px;padding:12px;border-radius:12px;background:#eef7f1;font-size:14px}
  .preview .big{display:flex;justify-content:space-between;align-items:baseline}
  .preview .big b{font-size:22px;color:var(--green-d)}
  .preview small{display:block;color:var(--muted);margin-top:4px}
  .btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:#eef3ef;color:var(--ink);margin-top:8px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1c2a22;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  details{margin-top:14px}
  summary{cursor:pointer;color:var(--green-d);font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍽️ Kcal Tracker <span id="mode" class="badge sync">Loading…</span></h1>
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
  </header>

  <div id="err" style="display:none;background:#fde3e0;color:#8a2a22;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:12px;cursor:pointer"></div>

  <div class="datebar">
    <button onclick="shiftDay(-1)">‹</button>
    <div class="d"><input type="date" id="datePick" onchange="setDate(this.value)"><small id="dayName"></small></div>
    <button onclick="shiftDay(1)">›</button>
  </div>

  <div class="card">
    <div class="ring-wrap">
      <div class="ring">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="56" fill="none" stroke="#edf1ee" stroke-width="12"/>
          <circle id="arc" cx="66" cy="66" r="56" fill="none" stroke="#2f9e66" stroke-width="12" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86" style="transition:.5s"/>
        </svg>
        <div class="c"><b id="kcalNow">0</b><span>kcal eaten</span></div>
      </div>
      <div class="stats">
        <div><span>Goal</span><b id="goalTxt">2000</b></div>
        <div><span>Remaining</span><b id="remTxt">2000</b></div>
        <div><span>Items logged</span><b id="cntTxt">0</b></div>
      </div>
    </div>
    <div class="macros">
      <div class="macro"><b id="pT">0g</b><div class="bar"><i id="pB" style="background:var(--blue);width:0"></i></div><small>Protein</small></div>
      <div class="macro"><b id="cT">0g</b><div class="bar"><i id="cB" style="background:var(--amber);width:0"></i></div><small>Carbs</small></div>
      <div class="macro"><b id="fT">0g</b><div class="bar"><i id="fB" style="background:var(--pink);width:0"></i></div><small>Fat</small></div>
    </div>
  </div>

  <div id="list"></div>
</div>

<button class="fab" onclick="openAdd()">＋ Add food</button>

<!-- Add entry sheet -->
<div class="sheet-bg" id="addBg" onclick="if(event.target===this)closeAll()">
  <div class="sheet">
    <h2>Log food</h2>
    <label>Meal</label>
    <div class="chips" id="mealChips"></div>

    <div id="recentWrap">
      <label>Recent</label>
      <div class="chips" id="recentChips"></div>
    </div>

    <label>Search food <span id="foodCount" style="float:right"></span></label>
    <div class="searchbox">
      <input id="q" placeholder="Search and tap to add: dal, rice, curd…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clr" id="clr" onclick="clearSearch()">✕</button>
    </div>
    <div class="results" id="results"></div>
    <div class="picklbl" id="pickLbl">Tap foods to add them, then set quantity for each</div>
    <div id="picked"></div>

    <div class="preview">
      <div class="big"><span id="prevLbl">Total</span><b id="prev">—</b></div>
      <small id="prevMac"></small>
    </div>

    <details>
      <summary>Not in the list? Enter manually</summary>
      <label>Food name</label><input id="mName" placeholder="e.g. Home-made curry" autocomplete="off">
      <div class="row">
        <div><label>Kcal (total)</label><input id="mKcal" type="number" min="0" inputmode="decimal" placeholder="e.g. 250"></div>
        <div><label>Protein g</label><input id="mP" type="number" min="0" step="0.1" inputmode="decimal"></div>
        <div><label>Carbs g</label><input id="mC" type="number" min="0" step="0.1" inputmode="decimal"></div>
        <div><label>Fat g</label><input id="mF" type="number" min="0" step="0.1" inputmode="decimal"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin-top:12px">
        <input type="checkbox" id="saveFood" style="width:auto"> Also save to my food list
      </label>
      <button class="btn ghost" style="margin-top:12px" onclick="addManual()">＋ Add this item</button>
    </details>
    <button class="btn" id="saveBtn" onclick="saveEntry()" disabled>Save</button>
    <button class="btn ghost" onclick="closeAll()">Cancel</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet-bg" id="setBg" onclick="if(event.target===this)closeAll()">
  <div class="sheet">
    <h2>Settings</h2>
    <label>Daily goal (kcal)</label>
    <input id="goalIn" type="number" min="500" step="50" inputmode="numeric">
    <label>API token</label>
    <input id="tokIn" type="password" placeholder="Same as API_TOKEN in Code.gs" autocomplete="off">
    <p class="hint">Saved in this browser only. Backend is already connected to your Google Sheet.</p>
    <button class="btn" onclick="saveSettings()">Save settings</button>
    <button class="btn ghost" onclick="refreshFoods()">↻ Reload food list from Sheet</button>
    <button class="btn ghost" onclick="closeAll()">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= CONFIG ================= */
const BACKEND = 'https://script.google.com/macros/s/AKfycby5_6OgfOxRtOEzjIDfsZtTDwQjBGOFKD7Tl1-SxvhCyT-ES-zjBPZAGHO-Wj20wKxI_A/exec';
const TOKEN_DEFAULT = 'CHANGE_ME_TO_A_SECRET';   // hardcoded, must match API_TOKEN in Code.gs
const MEALS = ['Breakfast','Lunch','Snack','Dinner'];
const QTY_PRESETS = [0.5,1,1.5,2,3,4];

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const pad=n=>String(n).padStart(2,'0');
const r1=n=>Math.round((+n||0)*10)/10;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function guessMeal(){const h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<19?'Snack':'Dinner'}
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function setStatus(txt,cls){const m=$('mode');m.textContent=txt;m.className='badge '+(cls||'')}

/* ================= STATE ================= */
let token = TOKEN_DEFAULT || lsGet('kt_token','');
let date = todayStr(), entries = [], goal = 2000, meal = guessMeal();
let foods = [], fc = null, nameMap = new Map();
const dayCache = {};                  // date -> entries (instant date navigation)
let sel = null, results = [], activeIdx = -1, pending = 0;

/* ================= API ================= */
const GET_ACTIONS = ['init','listEntries','listFoods','getGoal','daySummary'];
async function api(action, payload={}){
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 30000);
  try{
    let res;
    if(GET_ACTIONS.includes(action)){
      res = await fetch(BACKEND+'?'+new URLSearchParams({action,token,...payload}), {signal:ctl.signal});
    } else {
      res = await fetch(BACKEND, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action,token,...payload}), signal:ctl.signal});
    }
    const raw = await res.text(); let j;
    try{ j = JSON.parse(raw) }
    catch{ throw new Error('Backend returned a web page, not data. In Apps Script: Deploy > Manage deployments > set "Who has access" to Anyone, then use the /exec URL.') }
    if(!j.ok) throw new Error(j.error||'Request failed');
    return j.data;
  } catch(e){
    if(e.name==='AbortError') throw new Error('Timed out. Check connection.');
    if(e instanceof TypeError) throw new Error('Could not reach the backend (blocked or offline). Check internet, and that the Apps Script deployment has "Who has access: Anyone".');
    throw e;
  } finally { clearTimeout(to) }
}
function busy(delta){pending+=delta; if(pending>0) setStatus('Syncing…','sync'); else if($('mode').className.indexOf('off')<0) setStatus('Live · Sheets','')}

/* ================= FOOD INDEX ================= */
function indexFoods(){
  foods.forEach(f=>{f._n=f.name.toLowerCase()});
  nameMap = new Map(foods.map(f=>[f._n,f]));
  $('foodCount').textContent = foods.length+' foods';
}
const WORD_START = /[\s(\/\-]/;
function search(q){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length) return [];
  const rec = lsGet('kt_recent',[]);
  const out = [];
  for(const f of foods){
    const n = f._n; let score = 0, ok = true;
    for(const t of toks){
      const i = n.indexOf(t);
      if(i<0){ok=false;break}
      score += i===0 ? 0 : WORD_START.test(n[i-1]) ? 1 : 3;
    }
    if(!ok) continue;
    score += n.length/200;                       // shorter / simpler names first
    if(rec.indexOf(f.name)>-1) score -= 1.5;     // recently used boost
    if(n===toks.join(' ')) score -= 5;           // exact match
    out.push([score,f]);
  }
  out.sort((a,b)=>a[0]-b[0]);
  return out.slice(0,40).map(x=>x[1]);
}
function hl(name,toks){
  let s = esc(name);
  toks.forEach(t=>{ if(t.length<1) return;
    const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); s = s.replace(re,'<mark>$1</mark>'); });
  return s;
}

/* ================= LOAD ================= */
async function loadAll(){
  const cached = lsGet('kt_foods',null);
  if(cached){foods=cached.foods;fc=cached.fc;indexFoods()}
  if(!token){openSettings();toast('Enter your API token once');}
  try{
    busy(1);
    let d;
    try{ d = await api('init',{date,fc:fc==null?'':fc}); }
    catch(e){ if(/Unknown action/i.test(e.message)) d = await legacyInit(); else throw e; }
    goal=d.goal; entries=d.entries; dayCache[date]=entries;
    if(d.foods){foods=d.foods;fc=d.fc;indexFoods();lsSet('kt_foods',{fc,foods})}
    $('err').style.display='none'; setStatus('Live · Sheets',''); render();
  }catch(e){ fail(e) }
  finally{ busy(-1) }
}
$('err').addEventListener('click',loadAll);
$('mode').addEventListener('click',loadAll);
async function legacyInit(){
  const [fl,en,g] = await Promise.all([api('listFoods'),api('listEntries',{date}),api('getGoal')]);
  return {foods:fl,fc:fl.length,entries:en,goal:g.goal};
}
function fail(e){
  setStatus('Offline','off'); toast('⚠ '+e.message);
  const b=$('err'); b.textContent='⚠ '+e.message+'  (tap to retry)'; b.style.display='block';
  if(/Unauthorized/i.test(e.message)) openSettings();
}
async function refreshFoods(){
  fc=null; lsSet('kt_foods',null); closeAll(); toast('Reloading foods…'); await loadAll(); toast(foods.length+' foods loaded');
}
async function loadEntries(){
  if(dayCache[date]){entries=dayCache[date];render()}   // instant
  try{
    busy(1);
    const e = await api('listEntries',{date});
    if(date && e){dayCache[date]=e;entries=e;render()}
    setStatus('Live · Sheets','');
  }catch(e){fail(e)} finally{busy(-1)}
}

/* ================= RENDER ================= */
function render(){
  $('datePick').value=date;
  const d=new Date(date+'T00:00');
  $('dayName').textContent=date===todayStr()?'Today':d.toLocaleDateString(undefined,{weekday:'long'});
  const t={kcal:0,protein:0,carbs:0,fat:0};
  entries.forEach(e=>{t.kcal+=+e.kcal||0;t.protein+=+e.protein||0;t.carbs+=+e.carbs||0;t.fat+=+e.fat||0});
  const rem=Math.round(goal-t.kcal), pct=Math.min(t.kcal/goal,1);
  $('kcalNow').textContent=Math.round(t.kcal);
  $('goalTxt').textContent=goal; $('remTxt').textContent=rem; $('cntTxt').textContent=entries.length;
  $('remTxt').style.color=rem<0?'var(--red)':'';
  const arc=$('arc'); arc.style.strokeDashoffset=351.86*(1-pct);
  arc.style.stroke=t.kcal>goal?'var(--red)':t.kcal>goal*.9?'var(--amber)':'var(--green)';
  const mx={protein:goal*.075,carbs:goal*.125,fat:goal*.033};
  [['p','protein'],['c','carbs'],['f','fat']].forEach(([k,n])=>{
    $(k+'T').textContent=Math.round(t[n])+'g';
    $(k+'B').style.width=Math.min(t[n]/mx[n]*100,100)+'%';
  });
  const list=$('list');
  if(!entries.length){list.innerHTML='<div class="empty">Nothing logged yet.<br>Tap “Add food” to start.</div>';return}
  const order=[...MEALS,...new Set(entries.map(e=>e.meal||'Other').filter(m=>!MEALS.includes(m)))];
  let html='';
  order.forEach(m=>{
    const es=entries.filter(e=>(e.meal||'Other')===m); if(!es.length)return;
    const sum=Math.round(es.reduce((a,e)=>a+(+e.kcal||0),0));
    html+=`<div class="meal-h">${esc(m)}<span>${sum} kcal</span></div>`;
    es.forEach(e=>{
      const tmp=String(e.id).startsWith('tmp-');
      html+=`<div class="entry${tmp?' pending':''}"><div class="t"><b>${esc(e.food)}</b><small>${esc(e.qty)} ${esc(e.unit||'')} · P${Math.round(e.protein)} C${Math.round(e.carbs)} F${Math.round(e.fat)}</small></div><div class="k">${Math.round(e.kcal)}</div><button class="x" data-id="${esc(e.id)}">✕</button></div>`;
    });
  });
  list.innerHTML=html;
}
$('list').addEventListener('click',e=>{const b=e.target.closest('.x');if(b)del(b.dataset.id)});

/* ================= DATE NAV ================= */
function setDate(v){if(!v)return;date=v;loadEntries()}
function shiftDay(n){const d=new Date(date+'T00:00');d.setDate(d.getDate()+n);date=ymd(d);loadEntries()}

/* ================= ADD SHEET ================= */
function openAdd(){
  $('mealChips').innerHTML=MEALS.map(m=>`<div class="chip ${m===meal?'on':''}" data-m="${m}">${m}</div>`).join('');
  ['q','mName','mKcal','mP','mC','mF'].forEach(i=>$(i).value='');
  $('saveFood').checked=false; $('clr').style.display='none';
  picks=[]; hideResults(); renderRecents(); renderPicks();
  $('addBg').classList.add('open');
  setTimeout(()=>$('q').focus(),150);
}
$('mealChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;meal=c.dataset.m;[...$('mealChips').children].forEach(x=>x.classList.toggle('on',x===c))});

function renderRecents(){
  const rec=lsGet('kt_recent',[]).filter(n=>nameMap.has(n.toLowerCase())).slice(0,8);
  $('recentWrap').style.display=rec.length?'block':'none';
  $('recentChips').innerHTML=rec.map(n=>`<div class="chip sm rc" data-n="${esc(n)}">${esc(n)}</div>`).join('');
}
$('recentChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const f=nameMap.get(c.dataset.n.toLowerCase());if(f)selectFood(f)});
function pushRecent(name){
  let rec=lsGet('kt_recent',[]).filter(n=>n!==name); rec.unshift(name); lsSet('kt_recent',rec.slice(0,30));
}

/* ---- search box ---- */
let st;
$('q').addEventListener('input',()=>{
  clearTimeout(st); st=setTimeout(runSearch,60);
  $('clr').style.display=$('q').value?'block':'none';
});
$('q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();moveAct(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();moveAct(-1)}
  else if(e.key==='Enter'){e.preventDefault();if(results[activeIdx>=0?activeIdx:0]) selectFood(results[activeIdx>=0?activeIdx:0]);}
  else if(e.key==='Escape'){hideResults()}
});
function runSearch(){
  const q=$('q').value.trim();
  if(!q){hideResults();return}
  results=search(q); activeIdx=results.length?0:-1;
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  const box=$('results');
  box.innerHTML = results.length
    ? results.map((f,i)=>`<div class="res${i===0?' act':''}" data-i="${i}"><b>${hl(f.name,toks)}</b><span>${Math.round(f.kcal)} kcal / ${esc(f.unit)}</span></div>`).join('')
    : `<div class="res-empty">No match. Use “Enter manually” below.</div>`;
  box.classList.add('show'); box.scrollTop=0;
}
function moveAct(d){
  if(!results.length)return;
  activeIdx=(activeIdx+d+results.length)%results.length;
  [...$('results').children].forEach((c,i)=>c.classList.toggle('act',i===activeIdx));
  $('results').children[activeIdx].scrollIntoView({block:'nearest'});
}
$('results').addEventListener('click',e=>{const r=e.target.closest('.res');if(r&&r.dataset.i!=null)selectFood(results[+r.dataset.i])});
function hideResults(){$('results').classList.remove('show')}
function clearSearch(){$('q').value='';hideResults();$('clr').style.display='none';$('q').focus()}

/* ================= MULTI-PICK ================= */
let picks=[];                                   // [{f, qty} | {manual:{name,kcal,p,c,f,saveFood}, qty:1}]
function selectFood(f){addPick(f)}
function addPick(f){
  const ex=picks.find(p=>p.f===f);
  if(ex) ex.qty=Math.round((ex.qty+1)*100)/100; else picks.push({f,qty:1});
  $('q').value=''; $('clr').style.display='none'; hideResults();
  renderPicks(); $('q').focus();
}
function addManual(){
  const name=$('mName').value.trim(), kcal=+$('mKcal').value;
  if(!name){toast('Enter the food name');return}
  if(!(kcal>0)){toast('Enter kcal');return}
  picks.push({qty:1,manual:{name,kcal,p:+$('mP').value||0,c:+$('mC').value||0,f:+$('mF').value||0,saveFood:$('saveFood').checked}});
  ['mName','mKcal','mP','mC','mF'].forEach(i=>$(i).value=''); $('saveFood').checked=false;
  document.querySelector('#addBg details').open=false;
  renderPicks();
}
function calcPick(p){
  if(p.manual) return {kcal:p.manual.kcal,p:p.manual.p,c:p.manual.c,f:p.manual.f};
  const q=+p.qty||0; return {kcal:p.f.kcal*q,p:p.f.protein*q,c:p.f.carbs*q,f:p.f.fat*q};
}
function pickSub(p){
  const c=calcPick(p), unit=p.manual?'manual':p.f.unit;
  return `${esc(unit)} · ${Math.round(c.kcal)} kcal · P${r1(c.p)} C${r1(c.c)} F${r1(c.f)}`;
}
function renderPicks(){
  $('picked').innerHTML=picks.map((p,i)=>{
    const name=p.manual?p.manual.name:p.f.name;
    const q=p.manual?'':`<div class="pq"><button data-a="m" data-i="${i}">−</button><input type="number" inputmode="decimal" step="0.25" min="0" value="${p.qty}" data-i="${i}"><button data-a="p" data-i="${i}">＋</button></div>`;
    return `<div class="pick"><div class="pt"><b>${esc(name)}</b><small>${pickSub(p)}</small></div>${q}<button class="px" data-a="x" data-i="${i}">✕</button></div>`;
  }).join('');
  $('pickLbl').style.display=picks.length?'none':'block';
  updateTotals();
}
function updateTotals(){
  const t={kcal:0,p:0,c:0,f:0};
  picks.forEach(p=>{const c=calcPick(p);t.kcal+=c.kcal;t.p+=c.p;t.c+=c.c;t.f+=c.f});
  const n=picks.length;
  $('prevLbl').textContent=n?`Total · ${n} item${n>1?'s':''}`:'Total';
  $('prev').textContent=n?Math.round(t.kcal)+' kcal':'—';
  $('prevMac').textContent=n?`Protein ${r1(t.p)}g · Carbs ${r1(t.c)}g · Fat ${r1(t.f)}g`:'';
  $('saveBtn').disabled=!n;
  $('saveBtn').textContent=n?`Save ${n} item${n>1?'s':''} to ${meal}`:'Save';
}
$('mealChips').addEventListener('click',()=>updateTotals());
$('picked').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const i=+b.dataset.i, p=picks[i]; if(!p)return;
  if(b.dataset.a==='x') picks.splice(i,1);
  else if(b.dataset.a==='p') p.qty=Math.round(((+p.qty||0)+0.5)*100)/100;
  else if(b.dataset.a==='m') p.qty=Math.max(0.5,Math.round(((+p.qty||0)-0.5)*100)/100);
  renderPicks();
});
$('picked').addEventListener('input',e=>{
  const inp=e.target.closest('input'); if(!inp)return;
  const p=picks[+inp.dataset.i]; if(!p)return;
  p.qty=+inp.value||0;
  inp.closest('.pick').querySelector('small').innerHTML=pickSub(p);
  updateTotals();
});

/* ================= SAVE / DELETE (optimistic) ================= */
async function saveEntry(){
  if(!picks.length){toast('Tap a food to add it');return}
  const d=date, m=meal, arr=entries;
  const items=[], locals=[], newFoods=[];
  for(const p of picks){
    const c=calcPick(p);
    if(p.manual){
      const mm=p.manual;
      items.push({food:mm.name,qty:1,unit:'serving',kcal:r1(mm.kcal),protein:r1(mm.p),carbs:r1(mm.c),fat:r1(mm.f)});
      if(mm.saveFood) newFoods.push({name:mm.name,unit:'serving',kcal:mm.kcal,protein:mm.p,carbs:mm.c,fat:mm.f});
    } else {
      const q=+p.qty>0?+p.qty:1;
      const k=p.f.kcal*q;
      items.push({food:p.f.name,qty:q,unit:p.f.unit,kcal:r1(k),protein:r1(p.f.protein*q),carbs:r1(p.f.carbs*q),fat:r1(p.f.fat*q)});
    }
  }
  items.forEach((it,i)=>{
    const e={id:'tmp-'+Date.now()+'-'+i,date:d,time:'',meal:m,...it};
    locals.push(e); arr.push(e); pushRecent(it.food);
  });
  dayCache[d]=arr; closeAll(); render();
  toast(`Added ${items.length} item${items.length>1?'s':''} ✓`);
  try{
    busy(1);
    for(const nf of newFoods){
      await api('addFood',nf);
      foods.push({...nf}); fc=foods.length; indexFoods(); lsSet('kt_foods',{fc,foods});
    }
    let res;
    try{ res=await api('addEntries',{date:d,meal:m,items}) }
    catch(err){
      if(!/Unknown action/i.test(err.message)) throw err;
      res=[];                                        // older backend: save one by one
      for(let i=0;i<items.length;i++){
        const r=await api('addEntry',{date:d,meal:m,...items[i]});
        locals[i].id=r.id; res.push(r);
      }
    }
    locals.forEach((e,i)=>{ if(res[i]&&res[i].id) e.id=res[i].id });
    render();
  }catch(err){
    locals.forEach(e=>{ if(String(e.id).startsWith('tmp-')){const i=arr.indexOf(e); if(i>-1) arr.splice(i,1)} });
    render(); fail(err);
  } finally{busy(-1)}
}
async function del(id){
  if(String(id).startsWith('tmp-')){toast('Still saving…');return}
  if(!confirm('Delete this entry?'))return;
  const prev=entries; entries=entries.filter(e=>e.id!==id); dayCache[date]=entries; render();
  try{busy(1);await api('deleteEntry',{id});toast('Deleted')}
  catch(err){entries=prev;dayCache[date]=prev;render();fail(err)}
  finally{busy(-1)}
}

/* ================= SETTINGS ================= */
function openSettings(){$('goalIn').value=goal;$('tokIn').value=token;$('setBg').classList.add('open')}
async function saveSettings(){
  token=$('tokIn').value.trim(); lsSet('kt_token',token);
  const g=+$('goalIn').value;
  closeAll();
  try{ if(g>0&&g!==goal){await api('setGoal',{kcal:g});goal=g} toast('Saved ✓'); await loadAll(); }
  catch(e){fail(e)}
}
function closeAll(){document.querySelectorAll('.sheet-bg').forEach(b=>b.classList.remove('open'))}

loadAll();
</script>
